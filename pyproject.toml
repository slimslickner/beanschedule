[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "beanschedule"
dynamic = ["version"]
description = "Ledger-native scheduled transactions for Beancount."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Tim Tickner" }]
keywords = ["beancount", "scheduling", "recurring", "beangulp", "fava"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "argcomplete>=3.7",
  "beancount>=3.2,<4",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
fava = ["fava>=1.30,<2"]
beangulp = ["beangulp>=0.2"]
migrate = ["pyyaml>=6.0"]

[dependency-groups]
dev = [
  "beangulp>=0.2",
  "fava>=1.30,<2",
  "pre-commit",
  "pyyaml>=6.0",
  "pytest",
  "pytest-cov",
  "ruff",
  "ty",
]

[project.scripts]
beanschedule = "beanschedule.cli:main"

[project.urls]
Homepage = "https://github.com/slimslickner/beanschedule"
Repository = "https://github.com/slimslickner/beanschedule"
Issues = "https://github.com/slimslickner/beanschedule/issues"

[tool.uv]
default-groups = ["dev"]

# The version is derived from the git tag (the source of truth); the release
# workflow tags a commit and the build stamps that version.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/beanschedule/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/beanschedule"]

# --- Ruff: one tool for linting and formatting ---------------------------------

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py313"
# `_version.py` is generated by hatch-vcs at build time.
exclude = ["src/beanschedule/_version.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing comma: conflicts with the formatter
  "COM819", # prohibited trailing comma: conflicts with the formatter
  "CPY001", # copyright: the MIT licence lives in the top-level LICENSE file
  "ISC001", # single-line implicit string concat: conflicts with the formatter
  "ISC002", # multi-line implicit string concat: conflicts with the formatter
  "D206",   # docstring indentation: the formatter decides
  "D300",   # docstring quote style: the formatter decides
  "E111",   # indentation: conflicts with the formatter
  "E114",   # indentation: conflicts with the formatter
  "E117",   # over-indentation: conflicts with the formatter
  "E501",   # line length: the formatter wraps code; long strings/URLs remain
  "FA100",  # `from __future__ import annotations` is unnecessary on 3.13
  "FA102",  # PEP 604 unions are usable without the future import on 3.13
  "Q000",   # inline quotes: the formatter decides
  "Q001",   # multiline quotes: the formatter decides
  "Q002",   # docstring quotes: the formatter decides
  "Q003",   # avoidable escaped quote: the formatter decides
  "W191",   # tab indentation: the formatter decides
]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests favour brevity: no docstrings, plain asserts, magic numbers, fixtures.
"tests/**" = [
  "ANN",     # tests need not be annotated
  "D",       # tests need not be documented
  "FBT",     # boolean positional args are fine in tests
  "INP001",  # tests are not a package
  "PLR2004", # magic values are expected in assertions
  "S101",    # plain `assert` is the pytest idiom
  "SLF001",  # tests may poke private helpers
  "TC",      # test helpers need not defer type-only imports
]
# The CLI prints to stdout by design, and walks argparse's private parser tree
# to render its own documentation.
"src/beanschedule/cli.py" = ["T201", "SLF001"]

# --- ty: type checking ----------------------------------------------------------

[tool.ty.environment]
python-version = "3.13"

# --- pytest ---------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = [
  "--doctest-modules",
  "--cov=beanschedule.core",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
testpaths = ["src", "tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["beanschedule"]

[tool.coverage.report]
show_missing = true
